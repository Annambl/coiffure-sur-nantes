function refreshAutomaticCancellations(){
  try{
    return supabaseRpc("cancel_unpaid_appointments",{}).catch(e=>console.warn("automatic cancellation refresh",e));
  }catch(e){
    console.warn("automatic cancellation refresh",e);

function paymentPendingBadge(status){
  const s=String(status||"").toLowerCase();
  if(s.includes("vérifié")) return '<span class="payment-status payment-verified">✅ Acompte vérifié</span>';
  if(s.includes("rejeté")) return '<span class="payment-status payment-rejected">❌ Acompte rejeté</span>';
  return '<span class="payment-status payment-pending">⏳ Acompte en attente de vérification</span>';
}

async function supabaseRpc(functionName, body){
  if(!navigator.onLine) throw Object.assign(new Error("OFFLINE"),{code:"OFFLINE"});
  const url=`${SUPABASE_URL}/rest/v1/rpc/${encodeURIComponent(functionName)}`;
  let response;
  try{
    response=await fetch(url,{
      method:"POST",
      mode:"cors",
      credentials:"omit",
      cache:"no-store",
      headers:{
        "apikey":SUPABASE_PUBLISHABLE_KEY,
        "Content-Type":"application/json",
        "Accept":"application/json"
      },
      body:JSON.stringify(body||{})
    });
  }catch(networkError){
    throw Object.assign(new Error("NETWORK_ERROR"),{code:"NETWORK_ERROR",cause:networkError});
  }
  const text=await response.text();
  let data=null;
  if(text){try{data=JSON.parse(text)}catch(_){data=text}}
  if(!response.ok){
    const err=typeof data==="object"&&data?data:{};
    throw Object.assign(new Error(err.message||err.error||`HTTP ${response.status}`),{
      code:err.code||`HTTP_${response.status}`,
      details:err.details||"",
      hint:err.hint||"",
      status:response.status
    });
  }
  return data;
}

function loadData(){
  let raw=null;
  let migrated=false;
  try{
    raw=localStorage.getItem(KEY);
    if(!raw){
      raw=localStorage.getItem(OLD_KEY);
      migrated=!!raw;
    }
  }catch(_){ raw=null; }

  let d;
  try{ d=raw?JSON.parse(raw):{appointments:[],clients:[]}; }
  catch(_){ d={appointments:[],clients:[]}; }
  if(!d || typeof d!=="object") d={appointments:[],clients:[]};

  d.appointments=Array.isArray(d.appointments)?d.appointments:[];
  d.clients=Array.isArray(d.clients)?d.clients:[];

  // Normalize old/local data defensively so one malformed value cannot stop the app.
  d.appointments=d.appointments.filter(a=>a && typeof a==="object").map(a=>{
    const name=String(a.clientName ?? a.client ?? "").trim();
    let first=String(a.firstName ?? "").trim();
    let last=String(a.lastName ?? "").trim();
    if(!first && !last && name){
      const parts=name.split(/\s+/);
      first=parts.shift()||"";
      last=parts.join(" ");
    }
    const clientName=(first+" "+last).trim()||name;
    const key=String(a.clientKey ?? clientName).toLowerCase().replace(/\s+/g," ").trim();
    return {
      ...a,
      clientName,
      firstName:first,
      lastName:last,
      phone:String(a.phone ?? ""),
      email:String(a.email ?? ""),
      clientNotes:String(a.clientNotes ?? ""),
      reminder:String(a.reminder ?? "24h"),
      clientKey:key
    };
  });

  const byKey=new Map();
  d.clients.filter(c=>c && typeof c==="object").forEach(c=>{
    const name=String(c.name ?? ((c.firstName??"")+" "+(c.lastName??""))).trim();
    const key=String(c.key ?? name).toLowerCase().replace(/\s+/g," ").trim();
    if(key) byKey.set(key,{...c,key,name:name||key,phone:String(c.phone??""),email:String(c.email??""),notes:String(c.notes??"")});
  });
  d.appointments.forEach(a=>{
    if(!a.clientKey)return;
    const prev=byKey.get(a.clientKey)||{key:a.clientKey,name:a.clientName};
    byKey.set(a.clientKey,{...prev,name:prev.name||a.clientName,firstName:prev.firstName||a.firstName,lastName:prev.lastName||a.lastName,phone:prev.phone||a.phone,email:prev.email||a.email,notes:prev.notes||a.clientNotes});
  });
  d.clients=Array.from(byKey.values());

  try{
    if(migrated || !localStorage.getItem(KEY)) localStorage.setItem(KEY,JSON.stringify(d));
  }catch(_){}
  return d;
}

  }
  if(deferredInstallPrompt){

    deferredInstallPrompt.userChoice.then(choice=>{
      if(choice.outcome === "accepted") {
        const b=document.getElementById("installAppBtn");
        if(b){b.textContent="✅ APPLICATION INSTALLÉE";b.disabled=true;}
      }
    }).finally(()=>{deferredInstallPrompt=null;});

  }
  const fallback=document.getElementById("installFallbackText");
  if(fallback){
    fallback.innerHTML="Android n’a pas encore affiché la fenêtre automatique. Appuyez sur <strong>⋮</strong> en haut à droite de Chrome puis sur <strong>Installer l’application</strong>.";

async function lookupPaymentAppointment(){
 const ref=(document.getElementById('payRef')?.value||'').trim().toUpperCase();
 const phone=(document.getElementById('payPhone')?.value||'').trim();
 const err=document.getElementById('payLookupError'),box=document.getElementById('paymentAppointmentBox');
 const id=Number(ref.replace(/^CSN-/i,''));
 if(!Number.isInteger(id)||id<=0||!phone){if(err)err.textContent='Indiquez une référence CSN valide et le téléphone utilisé pour la réservation.';return;}
 if(err)err.textContent='Vérification…';
 try{
   const rows=await supabaseRpc('get_public_appointment_status',{p_id:id,p_phone:phone});
   const a=Array.isArray(rows)?rows[0]:rows;
   if(!a){currentPaymentAppointment=null;if(box)box.innerHTML='';if(err)err.textContent='Aucun rendez-vous trouvé avec ces informations.';return;}
   currentPaymentAppointment={id:Number(a.id),phone,service:a.service_name||'',amount:Number(a.service_price)||0,status:a.status||''};
   let payment=null;try{const pr=await supabaseRpc('get_public_payment_status',{p_appointment_id:Number(a.id),p_phone:phone});payment=Array.isArray(pr)?pr[0]:pr;}catch(_){}
   const pLabel=payment?.status==='Vérifié'?'Paiement vérifié':payment?.status==='Rejeté'?'Paiement rejeté':payment?.status==='En attente'?'Vérification en attente':'Aucun paiement déclaré';
   const cls=payment?.status==='Vérifié'?'payment-verified':payment?.status==='Rejeté'?'payment-rejected':payment?.status==='En attente'?'payment-pending':'';
   if(box)box.innerHTML=`<div class="payment-detail"><strong>${esc(a.service_name||'Rendez-vous')}</strong><span>${a.start_at?new Date(a.start_at).toLocaleDateString('fr-FR',{timeZone:'Europe/Paris'})+' · '+new Date(a.start_at).toLocaleTimeString('fr-FR',{timeZone:'Europe/Paris',hour:'2-digit',minute:'2-digit'}):''}</span><span>Acompte à payer : <strong>10 €</strong></span><span class="payment-status ${cls}">${pLabel}</span>${payment?.reference?`<span>Référence paiement : ${esc(payment.reference)}</span>`:''}${payment?.status!=='Vérifié'?`<button class="big-book" style="margin-top:10px" onclick="declarePayment()">✅ J’ai effectué le paiement</button>`:''}</div>`;
   if(err)err.textContent='';
 }catch(e){console.error('lookupPaymentAppointment',e);if(err)err.textContent='Impossible de vérifier ce rendez-vous pour le moment.';}
}

function publicCalendarMonth(y,m){
 const first=new Date(y,m,1), days=new Date(y,m+1,0).getDate();
 const start=(first.getDay()+6)%7;
 const names=["Lun","Mar","Mer","Jeu","Ven","Sam"];
 let cells=names.map(x=>`<div class="dow">${x}</div>`).join("");
 for(let i=0;i<start;i++)cells+='<div class="day empty"></div>';
 const today=isoToday();
 for(let d=1;d<=days;d++){
   const ds=`${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
   const dow=new Date(y,m,d).getDay();
   if(dow===0)continue;
   const past=ds<today;
   const state=publicAvailability[ds]||"loading";
   const unavailable=past||state==="booked";
   const cls=`day ${ds===today?"today":""} ${ds===publicBooking.date?"selected":""} ${unavailable?"unavailable":""} ${past?"past":""}`;
   const title=past?"Date passée":state==="booked"?"Réservé":"Disponible";
   cells+=`<button class="${cls}" ${unavailable?"disabled":""} onclick="publicSelectDate('${ds}')" title="${title}">${d}</button>`;
 }
 return `<div class="cal public-cal">${cells}</div>`;
}

let onlineSyncRunning=false;
let onlineSyncDone=false;
function parisDateTime(iso){
  const d=new Date(iso);
  if(isNaN(d))return {date:"",time:""};
  return {
    date:d.toLocaleDateString("en-CA",{timeZone:"Europe/Paris"}),
    time:d.toLocaleTimeString("fr-FR",{timeZone:"Europe/Paris",hour:"2-digit",minute:"2-digit",hour12:false})
  };
}
async function syncOnlineAppointments(force=false){
  if(onlineSyncRunning)return;
  if(!authSession)return;
  if(onlineSyncDone&&!force)return;
  onlineSyncRunning=true;
  try{
    const rows=await supabaseRpc("get_professional_online_appointments",{p_admin_code:"090720"});
    let changed=false;
    (rows||[]).forEach(r=>{
      const dt=parisDateTime(r.start_at);
      const existing=data.appointments.find(a=>String(a.id)===String(r.id));
      const base={
        id:String(r.id),clientName:`${r.client_first_name||""} ${r.client_last_name||""}`.trim(),
        firstName:r.client_first_name||"",lastName:r.client_last_name||"",phone:r.client_phone||"",
        email:r.client_email||"",clientNotes:"",service:r.service_name||"",date:dt.date,time:dt.time,
        price:Number(r.service_price)||0,deposit:Number(r.deposit)||0,status:r.status||"En attente",
        notes:r.notes||"Réservation en ligne",reminder:r.reminder||"24h",
        clientKey:clientKey(r.client_first_name||"",r.client_last_name||""),source:"public"
      };
      if(existing){
        Object.assign(existing,base,{deposit:existing.deposit??base.deposit,reminder:existing.reminder||base.reminder,notes:existing.notes||base.notes});
      }else{
        data.appointments.push(base);
        changed=true;
      }
      upsertClient({key:base.clientKey,name:base.clientName,firstName:base.firstName,lastName:base.lastName,phone:base.phone,email:base.email,notes:base.clientNotes});
    });
    if(changed)save();
    onlineSyncDone=true;
  }catch(e){
    console.warn("get_professional_online_appointments",e);
  }finally{
    onlineSyncRunning=false;
  }
}

 if(!confirm(`Confirmer le rendez-vous de ${a.clientName} le ${frDate(a.date)} à ${a.time} ?`))return;

function remindersPage(){

    .filter(a=>a.status!=="Annulé" && a.reminder!=="none")
    .map(a=>({a,dt:appointmentMoment(a)}))

    .sort((x,y)=>x.dt-y.dt);

  const due=upcoming.filter(x=>{
    const offset=x.a.reminder==="2h"?2:24;

function reminderCard(a,due){

  <div class="small">${esc(a.service)} · 🔔 ${reminderLabel(a)}</div>
  ${due?'<span class="badge">Rappel à envoyer</span>':""}
  <div class="actions" style="margin-top:8px">
  ${a.phone&&wa(a.phone)?`<a class="link" href="${waConfirm(a)}" target="_blank">💬 Envoyer sur WhatsApp</a>`:""}
  <button class="secondary" onclick="editAppointment('${a.id}')">✏️ Modifier</button>
  <button class="danger" onclick="deleteAppointment('${a.id}')">🗑️ Supprimer</button>
  </div></div>`;
}
async function deleteAppointment(id){
  const a=data.appointments.find(x=>String(x.id)===String(id));
  if(!a)return;
  const ok=confirm(`Supprimer le rendez-vous de ${a.clientName} le ${frDate(a.date)} à ${a.time} ?\n\nCette action est définitive.`);
  if(!ok)return;

  try{
    // For an online booking, cancel it centrally first so it does not come back
    // during the next Supabase synchronization.
    if(a.source==="public"){
      await supabaseRpc("set_public_appointment_status",{
        p_id:Number(a.id),
        p_phone:a.phone||"",
        p_status:"Annulé"
      });
    }

    data.appointments=data.appointments.filter(x=>String(x.id)!==String(id));
    save();
    render();
  }catch(e){
    console.error("deleteAppointment",e);
    alert("Le rendez-vous n'a pas pu être supprimé. Vérifiez la connexion puis réessayez.");
  }
}
async function requestNotifications(){
  if(!("Notification" in window)){alert("Les notifications ne sont pas prises en charge par ce navigateur.");return;}
  const p=await Notification.requestPermission();
  if(p==="granted"){
    new Notification("Coiffure sur Nantes",{body:"Les notifications sont activées pour cette session."});
  }else{
    alert("Les notifications n'ont pas été autorisées.");
  }
}
function budgetPage(){
 const month=new Date().toISOString().slice(0,7), arr=data.appointments.filter(a=>a.date?.startsWith(month)&&a.status!=="Annulé");
 const ca=arr.reduce((s,a)=>s+Number(a.price||0),0), dep=arr.reduce((s,a)=>s+Number(a.deposit||0),0), sol=ca-dep;
 document.getElementById('app').innerHTML=`<div class="card"><h2>Budget</h2><div class="sub">Mois en cours</div><div class="row" style="margin-top:18px"><div><b>${euro(ca)}</b><div class="small">Chiffre d'affaires</div></div><div><b>${euro(dep)}</b><div class="small">Acomptes reçus</div></div></div><div style="margin-top:18px"><b>${euro(sol)}</b><div class="small">Soldes restant à encaisser</div></div></div>
 <div class="card"><h2>Rendez-vous du mois</h2>${arr.map(a=>`<div class="appt"><b>${frDate(a.date)} · ${esc(a.clientName)}</b><div class="small">${esc(a.service)} · ${euro(a.price)} · Acompte ${euro(a.deposit)}</div></div>`).join("")||'<div class="emptymsg">Aucune donnée.</div>'}</div>`;
}
try{
  bindNav();
  let professionalUnlocked=false;
  try{professionalUnlocked=sessionStorage.getItem("csn_professional_unlocked")==="1"}catch(_){}
  authLoading=false;
  if(!isPublic()){
    if(professionalUnlocked){
      authSession={user:{email:"Accès professionnel"}};
      restoreAdminShell();
      render();
    }else{
      showLoginPage();
    }
  }else{
    render();
  }
}catch(startError){
  console.error("Startup error",startError);
  document.body.className="theme-light";
  const shell=document.getElementById("shell");
  if(shell) shell.innerHTML=`<main id="app" style="max-width:560px;margin:0 auto;padding:40px 18px"><div class="card"><h2>Application à recharger</h2><div class="sub">Une ancienne donnée locale empêche l’affichage. Fermez puis rouvrez l’application. Si le problème continue, ouvrez la page dans Chrome et effacez uniquement les données du site.</div><button style="width:100%;margin-top:18px" onclick="location.hash='';location.reload()">Recharger l’application</button></div></main>`;
}
refreshAutomaticCancellations();
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js?v=41").catch(()=>{});
</script>
