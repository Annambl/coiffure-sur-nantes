<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#b76e79"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png">
<title>Coiffure sur Nantes</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#fff7f7;color:#292226}header{background:linear-gradient(135deg,#b76e79,#d99aa3);color:white;padding:28px 20px 24px;border-radius:0 0 28px 28px}h1{margin:0;font-size:25px}header p{margin:5px 0 0;opacity:.9}.wrap{padding:18px;max-width:720px;margin:auto}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{background:white;border-radius:18px;padding:16px;box-shadow:0 3px 15px #0000000d;margin-bottom:12px}.big{font-size:25px;font-weight:750}.muted{color:#7c7074;font-size:13px}.btn{border:0;border-radius:14px;padding:13px 15px;background:#b76e79;color:white;font-weight:700;width:100%;font-size:15px}.btn2{background:#f3e1e4;color:#7f4650}.row{display:flex;gap:10px;align-items:center;justify-content:space-between}nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #eee;padding:9px 10px calc(9px + env(safe-area-inset-bottom));display:flex;justify-content:space-around}nav button{border:0;background:none;color:#75666b;font-size:12px}nav b{display:block;font-size:20px}main{padding-bottom:90px}input,select{width:100%;padding:12px;border:1px solid #eadde0;border-radius:12px;margin:6px 0 12px;background:#fff;font-size:15px}label{font-size:13px;font-weight:650}.pill{padding:6px 9px;border-radius:999px;background:#e7f5e9;color:#32723b;font-size:12px}.appt{border-left:4px solid #b76e79}.empty{text-align:center;padding:30px 10px;color:#897b80}
</style></head><body><header><h1>Coiffure sur Nantes</h1><p>Gestion de votre activité ✨</p></header><main class="wrap" id="app"></main>
<nav><button onclick="show('home')"><b>⌂</b>Accueil</button><button onclick="show('rdv')"><b>📅</b>Rendez-vous</button><button onclick="show('clients')"><b>👩🏾</b>Clientes</button><button onclick="show('budget')"><b>💰</b>Budget</button></nav>
<script>
const K='csn_data'; let d=JSON.parse(localStorage.getItem(K)||'null')||{rdv:[],clients:[],depenses:[],services:[{n:'Knotless medium',p:50},{n:'Knotless fine',p:50},{n:'Vanille twist',p:50},{n:'Fulani twist',p:50},{n:'Cornrows',p:45}]};
const save=()=>localStorage.setItem(K,JSON.stringify(d)); const money=n=>Number(n||0).toLocaleString('fr-FR',{style:'currency',currency:'EUR'});
function show(x){ if(x==='home')home(); if(x==='rdv')rdv(); if(x==='clients')clients(); if(x==='budget')budget(); }
function home(){let today=new Date().toISOString().slice(0,10), r=d.rdv.filter(x=>x.date===today); app.innerHTML=`<h2>Bonjour 👋🏾</h2><div class="grid"><div class="card"><div class="muted">CA enregistré</div><div class="big">${money(d.rdv.filter(x=>x.status!=='Annulé').reduce((s,x)=>s+ +x.price,0))}</div></div><div class="card"><div class="muted">Rendez-vous</div><div class="big">${d.rdv.length}</div></div></div><div class="card"><div class="row"><h3>Aujourd’hui</h3><span class="pill">${r.length} RDV</span></div>${r.length?r.map(a=>card(a)).join(''):'<div class="empty">Aucun rendez-vous aujourd’hui</div>'}</div><button class="btn" onclick="newRdv()">＋ Nouveau rendez-vous</button>`}
function card(a){return `<div class="card appt"><div class="row"><b>${a.time} · ${a.client}</b><span>${money(a.price)}</span></div><div class="muted">${a.service} · Acompte ${money(a.deposit)}</div></div>`}
function rdv(){let arr=[...d.rdv].sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));app.innerHTML=`<div class="row"><h2>Rendez-vous</h2><button class="btn" style="width:auto" onclick="newRdv()">＋ Ajouter</button></div>${arr.length?arr.map(card).join(''):'<div class="card empty">Aucun rendez-vous enregistré.</div>'}`}
function newRdv(){app.innerHTML=`<h2>Nouveau rendez-vous</h2><div class="card"><label>Cliente</label><input id="client" placeholder="Prénom et nom"><label>Prestation</label><select id="service">${d.services.map(s=>`<option value="${s.n}" data-p="${s.p}">${s.n} — ${money(s.p)}</option>`).join('')}</select><label>Date</label><input id="date" type="date"><label>Heure</label><input id="time" type="time"><label>Prix</label><input id="price" type="number" value="${d.services[0]?.p||0}"><label>Acompte</label><input id="deposit" type="number" value="20"><label>Notes</label><input id="notes" placeholder="Mèches fournies, longueur..."><button class="btn" onclick="addRdv()">Enregistrer</button></div>`}
function addRdv(){let a={client:client.value.trim(),service:service.value,date:date.value,time:time.value,price:+price.value,deposit:+deposit.value,notes:notes.value,status:'Confirmé'};if(!a.client||!a.date||!a.time)return alert('Remplis au minimum la cliente, la date et l’heure.');if(d.rdv.some(x=>x.date===a.date&&x.time===a.time))return alert('Ce créneau est déjà pris.');d.rdv.push(a);if(!d.clients.includes(a.client))d.clients.push(a.client);save();rdv()}
function clients(){app.innerHTML=`<div class="row"><h2>Clientes</h2></div><div class="card">${d.clients.length?d.clients.map(c=>`<div class="row" style="padding:12px 0;border-bottom:1px solid #eee"><b>👩🏾 ${c}</b><span class="muted">${d.rdv.filter(a=>a.client===c).length} RDV</span></div>`).join(''):'<div class="empty">Aucune cliente pour le moment.</div>'}</div>`}
function budget(){let ca=d.rdv.reduce((s,x)=>s+(x.status==='Annulé'?0:+x.price),0), dep=d.depenses.reduce((s,x)=>s+ +x.m,0);app.innerHTML=`<h2>Budget</h2><div class="grid"><div class="card"><div class="muted">Recettes</div><div class="big">${money(ca)}</div></div><div class="card"><div class="muted">Dépenses</div><div class="big">${money(dep)}</div></div></div><div class="card"><div class="muted">Bénéfice estimé</div><div class="big">${money(ca-dep)}</div></div><div class="card"><h3>Ajouter une dépense</h3><input id="dn" placeholder="Ex. mèches, gel, matériel"><input id="dm" type="number" placeholder="Montant €"><button class="btn" onclick="addDep()">Ajouter</button></div>`}
function addDep(){if(!dn.value||!dm.value)return;d.depenses.push({n:dn.value,m:+dm.value});save();budget()} show('home');
</script></body></html>
