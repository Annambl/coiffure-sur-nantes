function loadData(){
  let raw=localStorage.getItem(KEY);
  let migrated=false;
  if(!raw){
    raw=localStorage.getItem(OLD_KEY);
    migrated=!!raw;
  }
  let d;
  try{ d=raw?JSON.parse(raw):{appointments:[],clients:[]}; }
  catch(e){ d={appointments:[],clients:[]}; }

  d.appointments=Array.isArray(d.appointments)?d.appointments:[];
  d.clients=Array.isArray(d.clients)?d.clients:[];

  // Upgrade older appointments to the V7 client structure.
  d.appointments=d.appointments.map(a=>{
    const name=(a.clientName||a.client||"").trim();
    let first=a.firstName||"";
    let last=a.lastName||"";
    if(!first && !last && name){
      const parts=name.split(/\s+/);
      first=parts.shift()||"";
      last=parts.join(" ");
    }
    const clientName=(first+" "+last).trim()||name;
    const key=(a.clientKey||clientName).toLowerCase().replace(/\s+/g," ").trim();
    return {...a,clientName,firstName:first,lastName:last,phone:a.phone||"",email:a.email||"",clientNotes:a.clientNotes||"",reminder:a.reminder||"24h",clientKey:key};
  });

  // Rebuild/complete the client list from appointments without losing existing data.
  const byKey=new Map();
  d.clients.forEach(c=>{
    const name=(c.name||((c.firstName||"")+" "+(c.lastName||""))).trim();
    const key=(c.key||name).toLowerCase().replace(/\s+/g," ").trim();
    if(key) byKey.set(key,{...c,key,name:name||key,phone:c.phone||"",email:c.email||"",notes:c.notes||""});
  });
  d.appointments.forEach(a=>{
    if(!a.clientKey)return;
    const prev=byKey.get(a.clientKey)||{key:a.clientKey,name:a.clientName};
    byKey.set(a.clientKey,{...prev,name:prev.name||a.clientName,firstName:prev.firstName||a.firstName,lastName:prev.lastName||a.lastName,phone:prev.phone||a.phone,email:prev.email||a.email,notes:prev.notes||a.clientNotes});
  });
  d.clients=Array.from(byKey.values());

  if(migrated || !localStorage.getItem(KEY)) localStorage.setItem(KEY,JSON.stringify(d));
  return d;
}

function clientKey(first,last){return (first+" "+last).trim().toLowerCase().replace(/\s+/g," ")}
function getClient(key){return data.clients.find(c=>c.key===key)}
function upsertClient(c){
 let old=getClient(c.key);

 save();
}

async function sendPasswordReset(){
  const email=document.getElementById("resetEmail")?.value.trim();
  const err=document.getElementById("resetError");
  const btn=document.getElementById("resetBtn");
  if(!email){if(err)err.textContent="Renseignez votre adresse e-mail.";return;}
  if(btn){btn.disabled=true;btn.textContent="ENVOI…";}
  const redirectTo=window.location.origin+window.location.pathname;
  const {error}=await supabaseClient.auth.resetPasswordForEmail(email,{redirectTo});
  if(error){
    const msg=(error.message||"").toLowerCase();
    let friendly=error.message||"Impossible d'envoyer l'e-mail. Réessayez plus tard.";
    if(error.status===429 || msg.includes("rate limit") || msg.includes("too many")){
      friendly="Trop de demandes de réinitialisation ont été envoyées. Avec l’e-mail intégré de Supabase, la limite est de 2 e-mails par heure. Attendez un peu puis réessayez.";
    }else if(msg.includes("failed to fetch")){
      friendly="Connexion à Supabase impossible pour le moment. Vérifiez votre connexion Internet puis réessayez.";
    }else if(msg.includes("redirect") || msg.includes("url")){
      friendly="L’adresse de retour n’est pas encore autorisée dans Supabase. Vérifiez les URL de redirection du projet.";
    }
    if(err)err.textContent=friendly;
    if(btn){btn.disabled=false;btn.textContent="ENVOYER LE LIEN";}
    return;
  }
  if(err){err.style.color="#39734a";err.textContent="Si cette adresse correspond à votre compte, un e-mail de réinitialisation vient d'être envoyé. Vérifiez votre boîte mail.";}
  if(btn){btn.disabled=true;btn.textContent="LIEN ENVOYÉ ✓";}
}

function mapCloudAppointment(r){
 return {
   id:String(r.id),clientName:r.client_name||((r.first_name||"")+" "+(r.last_name||"")).trim(),
   firstName:r.first_name||"",lastName:r.last_name||"",phone:r.phone||"",email:r.email||"",
   clientNotes:r.client_notes||"",service:r.service||services[0],date:r.booking_date,time:String(r.booking_time||"").slice(0,5),
   price:Number(r.price||0),deposit:Number(r.deposit||0),status:r.status||"En attente",notes:r.notes||"",reminder:r.reminder||"24h",
   clientKey:clientKey(r.first_name||"",r.last_name||"")
 };
}
async function loadCloudAppointments(){
  cloudSyncBusy=true;
  try{
    const {data:rows,error}=await adminRpc("admin_list_appointments");
    if(error) throw error;
    const cloud=(rows||[]).map(mapCloudAppointment);
    if(!sessionStorage.getItem("csn_cloud_migrated_v23") && data.appointments.length){
      for(const a of data.appointments){
        await adminRpc("admin_upsert_appointment",{
          p_id:Number(a.id)||null,p_client_name:a.clientName||"",p_first_name:a.firstName||"",p_last_name:a.lastName||"",
          p_phone:a.phone||"",p_email:a.email||null,p_client_notes:a.clientNotes||"",p_service:a.service||services[0],
          p_date:a.date,p_time:a.time,p_price:Number(a.price||0),p_deposit:Number(a.deposit||0),p_status:a.status||"En attente",
          p_reminder:a.reminder||"24h",p_notes:a.notes||""
        });
      }
      sessionStorage.setItem("csn_cloud_migrated_v23","1");
      const again=await adminRpc("admin_list_appointments");
      if(!again.error) cloud.splice(0,cloud.length,...(again.data||[]).map(mapCloudAppointment));
    }
    data.appointments=cloud;
    const byKey=new Map();
    data.clients.forEach(c=>byKey.set(c.key,c));
    data.appointments.forEach(a=>{if(a.clientKey){const old=byKey.get(a.clientKey)||{key:a.clientKey};byKey.set(a.clientKey,{...old,name:a.clientName,firstName:a.firstName,lastName:a.lastName,phone:a.phone,email:a.email,notes:a.clientNotes});}});
    data.clients=[...byKey.values()];
    save();
    return true;
  }catch(e){
    console.warn("Synchronisation Supabase impossible",e);
    return false;
  }finally{cloudSyncBusy=false;}
}

 for(let d=1;d<=days;d++){
   const ds=`${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;

 }
 document.getElementById("pubCal").innerHTML=cells;
 document.getElementById("pubslots").innerHTML=loaded?"":'<div class="card emptymsg">Impossible de charger les disponibilités. Réessayez dans un instant.</div>';
 if(loaded) publicLoadSlots();

 <div class="row" style="margin-top:16px"><div><b>${aps.length}</b><div class="small">Rendez-vous</div></div><div><b>${euro(ca)}</b><div class="small">CA cliente</div></div></div>
 <div class="row" style="margin-top:16px"><div><b>${euro(deposits)}</b><div class="small">Acomptes</div></div><div><b>${euro(balance)}</b><div class="small">Solde à encaisser</div></div></div>
 <button class="danger" style="width:100%;margin-top:20px" onclick="deleteClient('${encodeURIComponent(c.key)}')">🗑️ Supprimer cette cliente</button>
 </div>
 <div class="card"><h2>Historique complet</h2>${aps.map(apptHTML).join("")||'<div class="emptymsg">Aucun rendez-vous.</div>'}</div>`;
}
function deleteClient(enc){
 const key=decodeURIComponent(enc), c=getClient(key);
 if(!c)return;
 const count=data.appointments.filter(a=>a.clientKey===key).length;
 const msg=count?`Supprimer ${c.name} ? Cela supprimera aussi ses ${count} rendez-vous de l'application.`:`Supprimer ${c.name} ?`;
 if(!confirm(msg))return;
 data.clients=data.clients.filter(x=>x.key!==key);
 data.appointments=data.appointments.filter(a=>a.clientKey!==key);
 save(); location.hash="clients"; render();
}
function wa(phone){let p=(phone||"").replace(/[^\d+]/g,"");if(p.startsWith("0"))p="33"+p.slice(1);if(p.startsWith("+"))p=p.slice(1);return /^33\d{9}$/.test(p)?`https://wa.me/${p}`:""}
function reminderLabel(a){
  return a.reminder==="2h"?"2 h avant":a.reminder==="none"?"Aucun rappel":"24 h avant";
}
function appointmentMoment(a){
  if(!a.date||!a.time)return null;
  const [y,m,d]=a.date.split("-").map(Number), [hh,mm]=a.time.split(":").map(Number);
  return new Date(y,m-1,d,hh,mm);
}
function remindersPage(){
  const now=new Date();
  const upcoming=data.appointments
    .filter(a=>a.status!=="Annulé" && a.reminder!=="none")
    .map(a=>({a,dt:appointmentMoment(a)}))
    .filter(x=>x.dt && x.dt.getTime()>now.getTime()-86400000)
    .sort((x,y)=>x.dt-y.dt);

  const due=upcoming.filter(x=>{
    const offset=x.a.reminder==="2h"?2:24;
    const reminderAt=x.dt.getTime()-offset*3600000;
    return reminderAt<=now.getTime() && x.dt.getTime()>now.getTime();
  });

  app.innerHTML=`<div class="card"><h2>🔔 Rappels</h2>
    <div class="sub">Les rappels enregistrés pour tes rendez-vous.</div>
    <button style="margin-top:14px" onclick="requestNotifications()">🔔 Activer les notifications</button>
    <div class="small" style="margin-top:10px">Sur Android, une notification locale peut être affichée lorsque l'application est ouverte. Pour des notifications fiables même quand l'application est complètement fermée, il faudra plus tard connecter un service de notifications.</div>
  </div>
  ${due.length?`<div class="card"><h2>⚠️ À rappeler maintenant</h2>${due.map(x=>reminderCard(x.a,true)).join("")}</div>`:""}
  <div class="card"><h2>📅 Prochains rappels</h2>
    ${upcoming.map(x=>reminderCard(x.a,false)).join("")||'<div class="emptymsg">Aucun rappel programmé.</div>'}
  </div>`;
}
function reminderCard(a,due){
  return `<div class="appt"><b>${frDate(a.date)} · ${esc(a.time)} · ${esc(a.clientName)}</b>
  <div class="small">${esc(a.service)} · 🔔 ${reminderLabel(a)}</div>
  ${due?'<span class="badge">Rappel à envoyer</span>':""}
  <div class="actions" style="margin-top:8px">
  ${a.phone&&wa(a.phone)?`<a class="link" href="${waConfirm(a)}" target="_blank">💬 Envoyer sur WhatsApp</a>`:""}
  <button class="secondary" onclick="editAppointment('${a.id}')">Modifier</button>
  </div></div>`;
}
async function requestNotifications(){
  if(!("Notification" in window)){alert("Les notifications ne sont pas prises en charge par ce navigateur.");return;}
  const p=await Notification.requestPermission();
  if(p==="granted"){
    new Notification("Coiffure sur Nantes",{body:"Les notifications sont activées pour cette session."});
  }else{
    alert("Les notifications n'ont pas été autorisées.");
  }
}
function budgetPage(){
 const month=new Date().toISOString().slice(0,7), arr=data.appointments.filter(a=>a.date?.startsWith(month)&&a.status!=="Annulé");
 const ca=arr.reduce((s,a)=>s+Number(a.price||0),0), dep=arr.reduce((s,a)=>s+Number(a.deposit||0),0), sol=ca-dep;
 app.innerHTML=`<div class="card"><h2>Budget</h2><div class="sub">Mois en cours</div><div class="row" style="margin-top:18px"><div><b>${euro(ca)}</b><div class="small">Chiffre d'affaires</div></div><div><b>${euro(dep)}</b><div class="small">Acomptes reçus</div></div></div><div style="margin-top:18px"><b>${euro(sol)}</b><div class="small">Soldes restant à encaisser</div></div></div>
 <div class="card"><h2>Rendez-vous du mois</h2>${arr.map(a=>`<div class="appt"><b>${frDate(a.date)} · ${esc(a.clientName)}</b><div class="small">${esc(a.service)} · ${euro(a.price)} · Acompte ${euro(a.deposit)}</div></div>`).join("")||'<div class="emptymsg">Aucune donnée.</div>'}</div>`;
}
bindNav();
// Public booking link: add #book to the application URL. Professional area is protected by a 6-digit code.
const professionalAccess=sessionStorage.getItem("csn_professional_access")==="1"; authLoading=false;
if(isRecoveryFlow()){showResetPasswordPage();}
else if(!isPublic() && location.hash==="#admin"){if(professionalAccess){authSession={codeAccess:true};loadCloudAppointments().finally(()=>{location.hash="#home";restoreAdminShell();render();});}else showLoginPage();}
else if(!isPublic() && !professionalAccess){showLoginPage();}
else{if(professionalAccess){authSession={codeAccess:true};loadCloudAppointments().finally(()=>render());}else render();}
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
</script>
</body></html>
