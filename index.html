<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#bb7180">
<link rel="manifest" href="manifest.webmanifest">
<title>Coiffure sur Nantes</title>
<style>
:root{--rose:#bb7180;--rose2:#f5e4e7;--ink:#29252a;--muted:#77727a;--bg:#fbf7f8;--card:#fff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{padding:22px 22px 12px;background:var(--bg);position:sticky;top:0;z-index:5}
h1{font-size:28px;margin:0 0 4px}h2{font-size:22px;margin:0 0 16px}.sub{color:var(--muted)}
main{padding:10px 18px 100px}.card{background:var(--card);border-radius:24px;padding:18px;margin:12px 0;box-shadow:0 3px 18px #00000008}
button{border:0;border-radius:15px;padding:13px 17px;background:var(--rose);color:#fff;font-weight:700;font-size:15px}
button.secondary{background:var(--rose2);color:#714652}button.danger{background:#f3dadd;color:#9b3949}
input,select,textarea{width:100%;padding:15px 16px;border:1px solid #ddd5d8;border-radius:15px;background:#fff;font-size:16px;color:var(--ink)}
textarea{min-height:88px;resize:vertical}label{display:block;font-weight:700;margin:15px 0 7px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.actions{display:flex;gap:8px;flex-wrap:wrap}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #eee;display:grid;grid-template-columns:repeat(4,1fr);z-index:10;padding:7px 4px calc(7px + env(safe-area-inset-bottom))}
nav button{background:transparent;color:#777;padding:7px 2px;font-weight:500;font-size:13px;border-radius:12px}nav button.active{color:var(--rose);font-weight:800}
.navicon{display:block;font-size:23px;line-height:25px}.hidden{display:none!important}
.calendar-head{display:flex;justify-content:space-between;align-items:center}.month{font-weight:800;font-size:19px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:14px}.dow{text-align:center;font-size:11px;color:#888;padding:4px}
.day{min-height:52px;background:#fafafa;border-radius:12px;padding:7px;text-align:left;border:1px solid #eee;color:#333}.day.empty{background:transparent;border:0}.day.today{border:2px solid var(--rose)}.day.selected{background:var(--rose2);border-color:var(--rose)}
.dot{width:6px;height:6px;background:var(--rose);border-radius:50%;display:inline-block;margin-left:3px}.appt{padding:12px 0;border-bottom:1px solid #eee}.appt:last-child{border-bottom:0}
.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:var(--rose2);color:#744651;font-size:12px;font-weight:700}
.client-card{display:flex;justify-content:space-between;gap:12px;align-items:center}.client-name{font-weight:800;font-size:17px}.small{font-size:13px;color:var(--muted)}
.emptymsg{color:#777;text-align:center;padding:25px 5px}
a.link{color:var(--rose);font-weight:700;text-decoration:none}
</style>
</head>
<body>
<header><h1 id="title">Coiffure sur Nantes</h1><div class="sub" id="subtitle">Votre agenda beauté</div></header>
<main id="app"></main>
<nav>
<button data-tab="home"><span class="navicon">⌂</span>Accueil</button>
<button data-tab="appointments"><span class="navicon">📅</span>Rendez-vous</button>
<button data-tab="clients"><span class="navicon">👩🏾</span>Clients</button>
<button data-tab="budget"><span class="navicon">💰</span>Budget</button>
</nav>
<script>
const KEY="csn_v7_data";
const services=["Knotless medium","Knotless fin épaule","Vanille twist épaule","Fulani twist épaule","Nattes collées"];
let data=JSON.parse(localStorage.getItem(KEY)||'{"appointments":[],"clients":[]}');
function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function euro(n){return (Number(n)||0).toFixed(2).replace(".",",")+" €"}
function isoToday(){let d=new Date();return d.toISOString().slice(0,10)}
function frDate(s){if(!s)return "";let [y,m,d]=s.split("-");return `${d}/${m}/${y}`}
function clientKey(first,last){return (first+" "+last).trim().toLowerCase().replace(/\s+/g," ")}
function getClient(key){return data.clients.find(c=>c.key===key)}
function upsertClient(c){
 let old=getClient(c.key);
 if(old){Object.assign(old,c)}
 else data.clients.push(c);
 save();
}
function nav(tab){location.hash=tab}
function currentTab(){return location.hash.replace("#","")||"home"}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>nav(b.dataset.tab));
window.addEventListener("hashchange",render);

function render(){
 document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("active",b.dataset.tab===currentTab()));
 const t=currentTab();
 if(t==="appointments") appointmentsPage(); else if(t==="clients") clientsPage(); else if(t==="budget") budgetPage(); else homePage();
}
function homePage(){
 const today=isoToday(), todayA=data.appointments.filter(a=>a.date===today);
 const month=new Date().toISOString().slice(0,7);
 const income=data.appointments.filter(a=>a.date?.startsWith(month)&&a.status!=="Annulé").reduce((s,a)=>s+Number(a.price||0),0);
 app.innerHTML=`<div class="card"><h2>Bonjour 👋🏾</h2><div class="sub">Voici votre activité du jour.</div>
 <div class="row" style="margin-top:15px"><div><b>${todayA.length}</b><div class="small">RDV aujourd'hui</div></div><div><b>${euro(income)}</b><div class="small">CA du mois</div></div></div></div>
 <div class="card"><h2>Prochains rendez-vous</h2>${data.appointments.filter(a=>a.date>=today&&a.status!=="Annulé").sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).slice(0,4).map(a=>apptHTML(a)).join("")||'<div class="emptymsg">Aucun rendez-vous à venir.</div>'}</div>
 <button onclick="newAppointment()">＋ Ajouter un rendez-vous</button>`;
}
function apptHTML(a){
 return `<div class="appt"><div><b>${esc(a.time)} · ${esc(a.clientName)}</b> <span class="badge">${esc(a.status)}</span></div><div class="small">${frDate(a.date)} · ${esc(a.service)} · ${euro(a.price)}</div>
 ${a.phone?`<div class="small">📞 ${esc(a.phone)}</div>`:""}</div>`
}
let calDate=new Date();
function appointmentsPage(){
 const y=calDate.getFullYear(),m=calDate.getMonth(),first=new Date(y,m,1),days=new Date(y,m+1,0).getDate(),start=(first.getDay()+6)%7;
 const names=["Lun","Mar","Mer","Jeu","Ven","Sam","Dim"];
 let cells=names.map(x=>`<div class="dow">${x}</div>`).join("");
 for(let i=0;i<start;i++)cells+='<div class="day empty"></div>';
 for(let d=1;d<=days;d++){
   let ds=`${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
   let count=data.appointments.filter(a=>a.date===ds&&a.status!=="Annulé").length;
   cells+=`<button class="day ${ds===isoToday()?"today":""}" onclick="selectedDay='${ds}';appointmentsPage()">${d}${count?` <span class="dot"></span>`:""}</button>`;
 }
 let selected=window.selectedDay||isoToday();
 let list=data.appointments.filter(a=>a.date===selected).sort((a,b)=>a.time.localeCompare(b.time));
 app.innerHTML=`<div class="card"><div class="calendar-head"><button class="secondary" onclick="calDate.setMonth(calDate.getMonth()-1);appointmentsPage()">‹</button><div class="month">${calDate.toLocaleDateString("fr-FR",{month:"long",year:"numeric"})}</div><button class="secondary" onclick="calDate.setMonth(calDate.getMonth()+1);appointmentsPage()">›</button></div>
 <div class="cal">${cells}</div></div>
 <div class="card"><div class="calendar-head"><h2>${frDate(selected)}</h2><button onclick="newAppointment('${selected}')">＋</button></div>
 ${list.map(a=>`<div class="appt"><b>${esc(a.time)} · ${esc(a.clientName)}</b><div class="small">${esc(a.service)} · ${euro(a.price)} · Acompte ${euro(a.deposit)}</div><span class="badge">${esc(a.status)}</span><div class="actions" style="margin-top:8px"><button class="secondary" onclick="editAppointment('${a.id}')">Modifier</button><button class="danger" onclick="cancelAppointment('${a.id}')">Annuler</button></div></div>`).join("")||'<div class="emptymsg">Aucun rendez-vous ce jour.</div>'}</div>`;
}
function newAppointment(date=isoToday(),existing=null){
 const a=existing||{id:Date.now().toString(),clientName:"",firstName:"",lastName:"",phone:"",email:"",clientNotes:"",service:services[0],date,time:"10:00",price:50,deposit:20,status:"Confirmé",notes:""};
 app.innerHTML=`<div class="card"><div class="calendar-head"><h2>${existing?"Modifier":"Nouveau"} rendez-vous</h2><button class="secondary" onclick="render()">Annuler</button></div>
 <label>Prénom</label><input id="first" value="${esc(a.firstName)}" placeholder="Prénom">
 <label>Nom</label><input id="last" value="${esc(a.lastName)}" placeholder="Nom">
 <label>📞 Téléphone</label><input id="phone" type="tel" value="${esc(a.phone)}" placeholder="06 00 00 00 00">
 <label>📧 E-mail</label><input id="email" type="email" value="${esc(a.email)}" placeholder="cliente@email.com">
 <label>📝 Notes sur la cliente</label><textarea id="clientNotes" placeholder="Préférences, habitudes, informations utiles...">${esc(a.clientNotes)}</textarea>
 <label>Prestation</label><select id="service">${services.map(s=>`<option ${s===a.service?"selected":""}>${esc(s)}</option>`).join("")}</select>
 <div class="row"><div><label>Date</label><input id="date" type="date" value="${a.date}"></div><div><label>Heure</label><input id="time" type="time" value="${a.time}"></div></div>
 <div class="row"><div><label>Prix (€)</label><input id="price" type="number" step="0.01" value="${a.price}"></div><div><label>Acompte (€)</label><input id="deposit" type="number" step="0.01" value="${a.deposit}"></div></div>
 <label>Statut</label><select id="status"><option ${a.status==="Confirmé"?"selected":""}>Confirmé</option><option ${a.status==="En attente"?"selected":""}>En attente</option><option ${a.status==="Annulé"?"selected":""}>Annulé</option></select>
 <label>Notes du rendez-vous</label><textarea id="notes" placeholder="Mèches, longueur, modèle...">${esc(a.notes)}</textarea>
 <button style="width:100%;margin-top:12px" onclick="saveAppointment('${a.id}',${!!existing})">Enregistrer le rendez-vous</button></div>`;
 window.scrollTo(0,0);
}
function saveAppointment(id,isEdit){
 const first=firstEl("first").value.trim(),last=firstEl("last").value.trim();
 if(!first&&!last){alert("Ajoute au moins le prénom ou le nom de la cliente.");return}
 const ckey=clientKey(first,last), old=data.appointments.find(x=>x.id===id);
 const a={id,clientName:(first+" "+last).trim(),firstName:first,lastName:last,phone:firstEl("phone").value.trim(),email:firstEl("email").value.trim(),clientNotes:firstEl("clientNotes").value.trim(),service:firstEl("service").value,date:firstEl("date").value,time:firstEl("time").value,price:Number(firstEl("price").value)||0,deposit:Number(firstEl("deposit").value)||0,status:firstEl("status").value,notes:firstEl("notes").value.trim(),clientKey:ckey};
 const conflict=data.appointments.some(x=>x.id!==id&&x.date===a.date&&x.time===a.time&&x.status!=="Annulé");
 if(conflict&&!confirm("Un autre rendez-vous est déjà prévu à cette heure. Enregistrer quand même ?"))return;
 if(isEdit){let i=data.appointments.findIndex(x=>x.id===id);data.appointments[i]=a}else data.appointments.push(a);
 upsertClient({key:ckey,name:a.clientName,firstName:first,lastName:last,phone:a.phone,email:a.email,notes:a.clientNotes});
 save(); location.hash="appointments"; selectedDay=a.date; render();
}
function firstEl(id){return document.getElementById(id)}
function editAppointment(id){let a=data.appointments.find(x=>x.id===id);if(a)newAppointment(a.date,a)}
function cancelAppointment(id){if(confirm("Annuler ce rendez-vous ?")){let a=data.appointments.find(x=>x.id===id);if(a)a.status="Annulé";save();render()}}
function clientsPage(){
 const clients=[...data.clients].sort((a,b)=>a.name.localeCompare(b.name));
 app.innerHTML=`<div class="card"><h2>Mes clientes</h2><div class="sub">${clients.length} cliente(s) enregistrée(s)</div></div>
 ${clients.map(c=>`<div class="card client-card"><div><div class="client-name">${esc(c.name)}</div><div class="small">${esc(c.phone||"Téléphone non renseigné")}</div><div class="small">${esc(c.email||"E-mail non renseigné")}</div></div><button onclick="clientProfile('${encodeURIComponent(c.key)}')">Voir</button></div>`).join("")||'<div class="card emptymsg">Aucune cliente pour le moment.</div>'}`;
}
function clientProfile(enc){
 const key=decodeURIComponent(enc),c=getClient(key),aps=data.appointments.filter(a=>a.clientKey===key).sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time));
 if(!c)return clientsPage();
 app.innerHTML=`<div class="card"><div class="calendar-head"><h2>${esc(c.name)}</h2><button class="secondary" onclick="clientsPage()">Retour</button></div>
 <div class="small">📞 ${esc(c.phone||"Non renseigné")}</div>
 ${c.phone?`<div class="actions" style="margin-top:12px"><a class="link" href="tel:${esc(c.phone)}">📞 Appeler</a>${wa(c.phone)?`<a class="link" href="${wa(c.phone)}" target="_blank">💬 WhatsApp</a>`:""}</div>`:""}
 <div class="small" style="margin-top:10px">📧 ${esc(c.email||"Non renseigné")}</div>
 <hr style="border:0;border-top:1px solid #eee;margin:16px 0">
 <b>Notes cliente</b><p class="sub">${esc(c.notes||"Aucune note.")}</p></div>
 const validAps=aps.filter(a=>a.status!=="Annulé");
 const ca=validAps.reduce((s,a)=>s+Number(a.price||0),0);
 const deposits=validAps.reduce((s,a)=>s+Number(a.deposit||0),0);
 const balance=ca-deposits;
 app.innerHTML=`<div class="card"><div class="calendar-head"><h2>${esc(c.name)}</h2><button class="secondary" onclick="clientsPage()">Retour</button></div>
 <div class="small">📞 ${esc(c.phone||"Non renseigné")}</div>
 ${c.phone?`<div class="actions" style="margin-top:12px"><a class="link" href="tel:${esc(c.phone)}">📞 Appeler</a>${wa(c.phone)?`<a class="link" href="${wa(c.phone)}" target="_blank">💬 WhatsApp</a>`:""}</div>`:""}
 <div class="small" style="margin-top:10px">📧 ${esc(c.email||"Non renseigné")}</div>
 <hr style="border:0;border-top:1px solid #eee;margin:16px 0">
 <b>Notes cliente</b><p class="sub">${esc(c.notes||"Aucune note.")}</p>
 <div class="row" style="margin-top:16px"><div><b>${aps.length}</b><div class="small">Rendez-vous</div></div><div><b>${euro(ca)}</b><div class="small">CA cliente</div></div></div>
 <div class="row" style="margin-top:16px"><div><b>${euro(deposits)}</b><div class="small">Acomptes</div></div><div><b>${euro(balance)}</b><div class="small">Soldes à encaisser</div></div></div>
 <button class="danger" style="width:100%;margin-top:20px" onclick="deleteClient('${encodeURIComponent(c.key)}')">🗑️ Supprimer cette cliente</button>
 </div>
 <div class="card"><h2>Historique complet</h2>${aps.map(apptHTML).join("")||'<div class="emptymsg">Aucun rendez-vous.</div>'}</div>`;
}
function deleteClient(enc){
 const key=decodeURIComponent(enc), c=getClient(key);
 if(!c)return;
 const count=data.appointments.filter(a=>a.clientKey===key).length;
 const msg=count?`Supprimer ${c.name} ? Cela supprimera aussi ses ${count} rendez-vous de l'application.`:`Supprimer ${c.name} ?`;
 if(!confirm(msg))return;
 data.clients=data.clients.filter(x=>x.key!==key);
 data.appointments=data.appointments.filter(a=>a.clientKey!==key);
 save(); location.hash="clients"; render();
}
function wa(phone){let p=(phone||"").replace(/[^\d+]/g,"");if(p.startsWith("0"))p="33"+p.slice(1);if(p.startsWith("+"))p=p.slice(1);return /^33\d{9}$/.test(p)?`https://wa.me/${p}`:""}
function budgetPage(){
 const month=new Date().toISOString().slice(0,7), arr=data.appointments.filter(a=>a.date?.startsWith(month)&&a.status!=="Annulé");
 const ca=arr.reduce((s,a)=>s+Number(a.price||0),0), dep=arr.reduce((s,a)=>s+Number(a.deposit||0),0), sol=ca-dep;
 app.innerHTML=`<div class="card"><h2>Budget</h2><div class="sub">Mois en cours</div><div class="row" style="margin-top:18px"><div><b>${euro(ca)}</b><div class="small">Chiffre d'affaires</div></div><div><b>${euro(dep)}</b><div class="small">Acomptes reçus</div></div></div><div style="margin-top:18px"><b>${euro(sol)}</b><div class="small">Soldes restant à encaisser</div></div></div>
 <div class="card"><h2>Rendez-vous du mois</h2>${arr.map(a=>`<div class="appt"><b>${frDate(a.date)} · ${esc(a.clientName)}</b><div class="small">${esc(a.service)} · ${euro(a.price)} · Acompte ${euro(a.deposit)}</div></div>`).join("")||'<div class="emptymsg">Aucune donnée.</div>'}</div>`;
}
render();
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
</script>
</body></html>
