const KEY="csn_v7_data";
const OLD_KEY="csn_data";
const services=["Knotless medium","Knotless fin épaule","Vanille twist épaule","Fulani twist épaule","Nattes collées"];

function loadData(){
  let raw=localStorage.getItem(KEY);
  let migrated=false;
  if(!raw){
    raw=localStorage.getItem(OLD_KEY);
    migrated=!!raw;
  }
  let d;
  try{ d=raw?JSON.parse(raw):{appointments:[],clients:[]}; }
  catch(e){ d={appointments:[],clients:[]}; }

  d.appointments=Array.isArray(d.appointments)?d.appointments:[];
  d.clients=Array.isArray(d.clients)?d.clients:[];

  // Upgrade older appointments to the V7 client structure.
  d.appointments=d.appointments.map(a=>{
    const name=(a.clientName||a.client||"").trim();
    let first=a.firstName||"";
    let last=a.lastName||"";
    if(!first && !last && name){
      const parts=name.split(/\s+/);
      first=parts.shift()||"";
      last=parts.join(" ");
    }
    const clientName=(first+" "+last).trim()||name;
    const key=(a.clientKey||clientName).toLowerCase().replace(/\s+/g," ").trim();
    return {...a,clientName,firstName:first,lastName:last,phone:a.phone||"",email:a.email||"",clientNotes:a.clientNotes||"",reminder:a.reminder||"24h",clientKey:key};
  });

  // Rebuild/complete the client list from appointments without losing existing data.
  const byKey=new Map();
  d.clients.forEach(c=>{
    const name=(c.name||((c.firstName||"")+" "+(c.lastName||""))).trim();
    const key=(c.key||name).toLowerCase().replace(/\s+/g," ").trim();
    if(key) byKey.set(key,{...c,key,name:name||key,phone:c.phone||"",email:c.email||"",notes:c.notes||""});
  });
  d.appointments.forEach(a=>{
    if(!a.clientKey)return;
    const prev=byKey.get(a.clientKey)||{key:a.clientKey,name:a.clientName};
    byKey.set(a.clientKey,{...prev,name:prev.name||a.clientName,firstName:prev.firstName||a.firstName,lastName:prev.lastName||a.lastName,phone:prev.phone||a.phone,email:prev.email||a.email,notes:prev.notes||a.clientNotes});
  });
  d.clients=Array.from(byKey.values());

  if(migrated || !localStorage.getItem(KEY)) localStorage.setItem(KEY,JSON.stringify(d));
  return d;
}
let data=loadData();
function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function euro(n){return (Number(n)||0).toFixed(2).replace(".",",")+" €"}
function isoToday(){
 let d=new Date();
 return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}
function frDate(s){if(!s)return "";let [y,m,d]=s.split("-");return `${d}/${m}/${y}`}
function clientKey(first,last){return (first+" "+last).trim().toLowerCase().replace(/\s+/g," ")}
function getClient(key){return data.clients.find(c=>c.key===key)}
function upsertClient(c){
 let old=getClient(c.key);
 if(old){Object.assign(old,c)}
 else data.clients.push(c);
 save();
}

async function sendPasswordReset(){
  const email=document.getElementById("resetEmail")?.value.trim();
  const err=document.getElementById("resetError");
  const btn=document.getElementById("resetBtn");
  if(!email){if(err)err.textContent="Renseignez votre adresse e-mail.";return;}
  if(btn){btn.disabled=true;btn.textContent="ENVOI…";}
  const redirectTo=window.location.origin+window.location.pathname;
  const {error}=await supabaseClient.auth.resetPasswordForEmail(email,{redirectTo});
  if(error){
    const msg=(error.message||"").toLowerCase();
    let friendly=error.message||"Impossible d'envoyer l'e-mail. Réessayez plus tard.";
    if(error.status===429 || msg.includes("rate limit") || msg.includes("too many")){
      friendly="Trop de demandes de réinitialisation ont été envoyées. Avec l’e-mail intégré de Supabase, la limite est de 2 e-mails par heure. Attendez un peu puis réessayez.";
    }else if(msg.includes("failed to fetch")){
      friendly="Connexion à Supabase impossible pour le moment. Vérifiez votre connexion Internet puis réessayez.";
    }else if(msg.includes("redirect") || msg.includes("url")){
      friendly="L’adresse de retour n’est pas encore autorisée dans Supabase. Vérifiez les URL de redirection du projet.";
    }
    if(err)err.textContent=friendly;
    if(btn){btn.disabled=false;btn.textContent="ENVOYER LE LIEN";}
    return;
  }
  if(err){err.style.color="#39734a";err.textContent="Si cette adresse correspond à votre compte, un e-mail de réinitialisation vient d'être envoyé. Vérifiez votre boîte mail.";}
  if(btn){btn.disabled=true;btn.textContent="LIEN ENVOYÉ ✓";}
}
function showResetPasswordPage(message=""){
  document.body.className="";
  document.getElementById("shell").innerHTML=`<main id="app" style="max-width:520px;margin:0 auto;padding:32px 18px 60px">
    <div class="card" style="margin-top:40px">
      <div class="lock">🔐</div>
      <h2 style="text-align:center">Créer un nouveau mot de passe</h2>
      <div class="sub" style="text-align:center">Choisissez votre nouveau mot de passe pour accéder à votre espace professionnel.</div>
      <label>Nouveau mot de passe</label>
      <input id="newPassword" type="password" autocomplete="new-password" placeholder="Au moins 8 caractères">
      <label>Confirmer le mot de passe</label>
      <input id="newPassword2" type="password" autocomplete="new-password" placeholder="Retapez votre mot de passe">
      <div id="newPasswordError" style="color:#9b3949;font-size:14px;margin-top:12px">${esc(message)}</div>
      <button id="updatePasswordBtn" style="width:100%;margin-top:14px" onclick="updatePassword()">ENREGISTRER LE NOUVEAU MOT DE PASSE</button>
    </div>
  </main>`;
}
async function updatePassword(){
  const p1=document.getElementById("newPassword")?.value||"";
  const p2=document.getElementById("newPassword2")?.value||"";
  const err=document.getElementById("newPasswordError");
  const btn=document.getElementById("updatePasswordBtn");
  if(p1.length<8){if(err)err.textContent="Le mot de passe doit contenir au moins 8 caractères.";return;}
  if(p1!==p2){if(err)err.textContent="Les deux mots de passe ne correspondent pas.";return;}
  if(btn){btn.disabled=true;btn.textContent="ENREGISTREMENT…";}
  const {error}=await supabaseClient.auth.updateUser({password:p1});
  if(error){
    if(err)err.textContent=error.message||"Impossible de modifier le mot de passe.";
    if(btn){btn.disabled=false;btn.textContent="ENREGISTRER LE NOUVEAU MOT DE PASSE";}
    return;
  }
  await supabaseClient.auth.signOut();
  authSession=null;
  history.replaceState({},document.title,window.location.pathname);
  location.hash="#admin";
  showLoginPage("Mot de passe modifié. Vous pouvez maintenant vous connecter.");
}
async function loginWithSupabase(){
  const email=document.getElementById("loginEmail")?.value.trim();
  const password=document.getElementById("loginPassword")?.value;
  const err=document.getElementById("loginError");
  const btn=document.getElementById("loginBtn");
  if(!email||!password){if(err)err.textContent="Renseignez votre e-mail et votre mot de passe.";return;}
  if(btn){btn.disabled=true;btn.textContent="CONNEXION…";}
  const {data,error}=await supabaseClient.auth.signInWithPassword({email,password});
  if(error){
    if(err)err.textContent="E-mail ou mot de passe incorrect.";
    if(btn){btn.disabled=false;btn.textContent="SE CONNECTER";}
    return;
  }
  authSession=data.session;
  location.hash="#home";
  restoreAdminShell();
  render();
}
async function logoutProfessional(){
  await supabaseClient.auth.signOut();

}

  const p1=document.getElementById("accountNewPassword")?.value||"";
  const p2=document.getElementById("accountNewPassword2")?.value||"";
  const err=document.getElementById("accountPasswordError");
  const btn=document.getElementById("accountPasswordBtn");
  if(p1.length<8){if(err)err.textContent="Le mot de passe doit contenir au moins 8 caractères.";return;}
  if(p1!==p2){if(err)err.textContent="Les deux mots de passe ne correspondent pas.";return;}
  if(btn){btn.disabled=true;btn.textContent="MODIFICATION…";}
  const {error}=await supabaseClient.auth.updateUser({password:p1});
  if(error){
    if(err)err.textContent=error.message||"Impossible de modifier le mot de passe.";
    if(btn){btn.disabled=false;btn.textContent="MODIFIER LE MOT DE PASSE";}
    return;
  }
  if(err){err.style.color="#39734a";err.textContent="Mot de passe modifié avec succès ✓";}
  const a=document.getElementById("accountNewPassword");
  const b=document.getElementById("accountNewPassword2");
  if(a)a.value=""; if(b)b.value="";
  if(btn){btn.disabled=false;btn.textContent="MODIFIER LE MOT DE PASSE";}
}

 <div class="card"><h2>🔔 Prochains rendez-vous</h2>${data.appointments.filter(a=>a.date>=today&&a.status!=="Annulé").sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).slice(0,4).map(a=>apptHTML(a)).join("")||'<div class="emptymsg">Aucun rendez-vous à venir.</div>'}</div>

function apptHTML(a){

function waConfirm(a){
 const p=(a.phone||"").replace(/[^\d+]/g,"");
 let n=p.startsWith("0")?"33"+p.slice(1):p.startsWith("+")?p.slice(1):p;
 const msg=`Bonjour ${a.firstName||a.clientName}, je vous confirme votre rendez-vous le ${frDate(a.date)} à ${a.time} pour ${a.service} chez Coiffure sur Nantes. Prix : ${euro(a.price)}. Acompte : ${euro(a.deposit)}. À bientôt 😊`;
 return `https://wa.me/${n}?text=${encodeURIComponent(msg)}`;
}
let calDate=new Date();
window.selectedDay=isoToday();

 const names=["Lun","Mar","Mer","Jeu","Ven","Sam","Dim"];
 let cells=names.map(x=>`<div class="dow">${x}</div>`).join("");
 for(let i=0;i<start;i++)cells+='<div class="day empty"></div>';
 for(let d=1;d<=days;d++){
   let ds=`${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
   let count=data.appointments.filter(a=>a.date===ds&&a.status!=="Annulé").length;
   cells+=`<button class="day ${ds===isoToday()?"today":""}" onclick="selectedDay='${ds}';appointmentsPage()">${d}${count?` <span class="dot"></span>`:""}</button>`;
 }
 let selected=window.selectedDay||isoToday();
 let list=data.appointments.filter(a=>a.date===selected).sort((a,b)=>a.time.localeCompare(b.time));
 let upcoming=data.appointments.filter(a=>a.date>=isoToday()&&a.status!=="Annulé").sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).slice(0,5);
 app.innerHTML=`<div class="card"><div class="calendar-head"><button class="secondary" onclick="calDate.setMonth(calDate.getMonth()-1);appointmentsPage()">‹</button><div class="month">${calDate.toLocaleDateString("fr-FR",{month:"long",year:"numeric"})}</div><button class="secondary" onclick="calDate.setMonth(calDate.getMonth()+1);appointmentsPage()">›</button></div>
 <div class="cal">${cells}</div></div>
 <div class="card"><div class="calendar-head"><h2>${frDate(selected)}</h2><button onclick="newAppointment('${selected}')">＋</button></div>
 ${list.map(a=>`<div class="appt"><b>${esc(a.time)} · ${esc(a.clientName)}</b><div class="small">${esc(a.service)} · ${euro(a.price)} · Acompte ${euro(a.deposit)}</div><span class="badge">${esc(a.status)}</span><div class="small">🔔 ${a.reminder==="2h"?"Rappel 2 h avant":a.reminder==="none"?"Sans rappel":"Rappel 24 h avant"}</div><div class="actions" style="margin-top:8px"><button class="secondary" onclick="editAppointment('${a.id}')">Modifier</button><button class="danger" onclick="cancelAppointment('${a.id}')">Annuler</button>${a.phone&&wa(a.phone)?`<a class="link" href="${waConfirm(a)}" target="_blank">💬 WhatsApp</a>`:""}</div></div>`).join("")||'<div class="emptymsg">Aucun rendez-vous ce jour.</div>'}</div>
 <div class="card"><div class="calendar-head"><h2>🔔 Prochains rappels</h2><button class="secondary" onclick="nav('reminders')">Voir tout</button></div>${upcoming.map(a=>`<div class="appt"><b>${frDate(a.date)} · ${esc(a.time)} · ${esc(a.clientName)}</b><div class="small">${esc(a.service)} · ${a.reminder==="2h"?"Rappel 2 h avant":a.reminder==="none"?"Aucun rappel":"Rappel 24 h avant"}</div>${a.phone&&wa(a.phone)?`<a class="link" href="${waConfirm(a)}" target="_blank">💬 Confirmer sur WhatsApp</a>`:""}</div>`).join("")||'<div class="emptymsg">Aucun prochain rendez-vous.</div>'}</div>`;
}
function newAppointment(date=isoToday(),existing=null){
 const a=existing||{id:Date.now().toString(),clientName:"",firstName:"",lastName:"",phone:"",email:"",clientNotes:"",service:services[0],date,time:"10:00",price:50,deposit:20,status:"Confirmé",notes:"",reminder:"24h"};

   <option value="none" ${(a.reminder||"24h")==="none"?"selected":""}>Aucun rappel</option>

 <label>Notes du rendez-vous</label><textarea id="notes" placeholder="Mèches, longueur, modèle...">${esc(a.notes)}</textarea>

function saveAppointment(id,isEdit){
 const first=firstEl("first").value.trim(),last=firstEl("last").value.trim();
 if(!first&&!last){alert("Ajoute au moins le prénom ou le nom de la cliente.");return}
 const ckey=clientKey(first,last), old=data.appointments.find(x=>x.id===id);
 const a={id,clientName:(first+" "+last).trim(),firstName:first,lastName:last,phone:firstEl("phone").value.trim(),email:firstEl("email").value.trim(),clientNotes:firstEl("clientNotes").value.trim(),service:firstEl("service").value,date:firstEl("date").value,time:firstEl("time").value,price:Number(firstEl("price").value)||0,deposit:Number(firstEl("deposit").value)||0,status:firstEl("status").value,reminder:firstEl("reminder").value,notes:firstEl("notes").value.trim(),clientKey:ckey};
 const conflict=data.appointments.some(x=>x.id!==id&&x.date===a.date&&x.status!=="Annulé");
 if(conflict&&!confirm("Cette journée est déjà réservée. Enregistrer un deuxième rendez-vous ce jour-là ?"))return;
 if(isEdit){let i=data.appointments.findIndex(x=>x.id===id);data.appointments[i]=a}else data.appointments.push(a);
 upsertClient({key:ckey,name:a.clientName,firstName:first,lastName:last,phone:a.phone,email:a.email,notes:a.clientNotes});
 save(); location.hash="appointments"; selectedDay=a.date; render();
}
function firstEl(id){return document.getElementById(id)}
function editAppointment(id){let a=data.appointments.find(x=>x.id===id);if(a)newAppointment(a.date,a)}
function cancelAppointment(id){if(confirm("Annuler ce rendez-vous ?")){let a=data.appointments.find(x=>x.id===id);if(a)a.status="Annulé";save();render()}}
function clientsPage(){

 app.innerHTML=`<div class="card"><h2>Mes clientes</h2><div class="sub">${clients.length} cliente(s) enregistrée(s)</div></div>
 ${clients.map(c=>`<div class="card client-card"><div><div class="client-name">${esc(c.name)}</div><div class="small">${esc(c.phone||"Téléphone non renseigné")}</div><div class="small">${esc(c.email||"E-mail non renseigné")}</div></div><button onclick="clientProfile('${encodeURIComponent(c.key)}')">Voir</button></div>`).join("")||'<div class="card emptymsg">Aucune cliente pour le moment.</div>'}`;

function clientProfile(enc){
 const key=decodeURIComponent(enc),c=getClient(key),aps=data.appointments.filter(a=>a.clientKey===key).sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time));
 if(!c)return clientsPage();
 const validAps=aps.filter(a=>a.status!=="Annulé");
 const ca=validAps.reduce((sum,a)=>sum+Number(a.price||0),0);
 const deposits=validAps.reduce((sum,a)=>sum+Number(a.deposit||0),0);

 app.innerHTML=`<div class="card">

 <div class="small">📞 ${esc(c.phone||"Non renseigné")}</div>
 ${c.phone?`<div class="actions" style="margin-top:12px"><a class="link" href="tel:${esc(c.phone)}">📞 Appeler</a>${wa(c.phone)?`<a class="link" href="${wa(c.phone)}" target="_blank">💬 WhatsApp</a>`:""}</div>`:""}

 <hr style="border:0;border-top:1px solid #eee;margin:16px 0">

 <div class="row" style="margin-top:16px"><div><b>${euro(deposits)}</b><div class="small">Acomptes</div></div><div><b>${euro(balance)}</b><div class="small">Solde à encaisser</div></div></div>

function deleteClient(enc){
 const key=decodeURIComponent(enc), c=getClient(key);
 if(!c)return;
 const count=data.appointments.filter(a=>a.clientKey===key).length;
 const msg=count?`Supprimer ${c.name} ? Cela supprimera aussi ses ${count} rendez-vous de l'application.`:`Supprimer ${c.name} ?`;
 if(!confirm(msg))return;
 data.clients=data.clients.filter(x=>x.key!==key);
 data.appointments=data.appointments.filter(a=>a.clientKey!==key);
 save(); location.hash="clients"; render();
}
function wa(phone){let p=(phone||"").replace(/[^\d+]/g,"");if(p.startsWith("0"))p="33"+p.slice(1);if(p.startsWith("+"))p=p.slice(1);return /^33\d{9}$/.test(p)?`https://wa.me/${p}`:""}
function reminderLabel(a){
  return a.reminder==="2h"?"2 h avant":a.reminder==="none"?"Aucun rappel":"24 h avant";
}
function appointmentMoment(a){
  if(!a.date||!a.time)return null;
  const [y,m,d]=a.date.split("-").map(Number), [hh,mm]=a.time.split(":").map(Number);
  return new Date(y,m-1,d,hh,mm);
}
function remindersPage(){
  const now=new Date();
  const upcoming=data.appointments
    .filter(a=>a.status!=="Annulé" && a.reminder!=="none")
    .map(a=>({a,dt:appointmentMoment(a)}))
    .filter(x=>x.dt && x.dt.getTime()>now.getTime()-86400000)
    .sort((x,y)=>x.dt-y.dt);

  const due=upcoming.filter(x=>{
    const offset=x.a.reminder==="2h"?2:24;
    const reminderAt=x.dt.getTime()-offset*3600000;
    return reminderAt<=now.getTime() && x.dt.getTime()>now.getTime();
  });

  app.innerHTML=`<div class="card"><h2>🔔 Rappels</h2>
    <div class="sub">Les rappels enregistrés pour tes rendez-vous.</div>
    <button style="margin-top:14px" onclick="requestNotifications()">🔔 Activer les notifications</button>
    <div class="small" style="margin-top:10px">Sur Android, une notification locale peut être affichée lorsque l'application est ouverte. Pour des notifications fiables même quand l'application est complètement fermée, il faudra plus tard connecter un service de notifications.</div>
  </div>
  ${due.length?`<div class="card"><h2>⚠️ À rappeler maintenant</h2>${due.map(x=>reminderCard(x.a,true)).join("")}</div>`:""}
  <div class="card"><h2>📅 Prochains rappels</h2>
    ${upcoming.map(x=>reminderCard(x.a,false)).join("")||'<div class="emptymsg">Aucun rappel programmé.</div>'}
  </div>`;
}
function reminderCard(a,due){
  return `<div class="appt"><b>${frDate(a.date)} · ${esc(a.time)} · ${esc(a.clientName)}</b>
  <div class="small">${esc(a.service)} · 🔔 ${reminderLabel(a)}</div>
  ${due?'<span class="badge">Rappel à envoyer</span>':""}
  <div class="actions" style="margin-top:8px">
  ${a.phone&&wa(a.phone)?`<a class="link" href="${waConfirm(a)}" target="_blank">💬 Envoyer sur WhatsApp</a>`:""}
  <button class="secondary" onclick="editAppointment('${a.id}')">Modifier</button>
  </div></div>`;
}
async function requestNotifications(){
  if(!("Notification" in window)){alert("Les notifications ne sont pas prises en charge par ce navigateur.");return;}
  const p=await Notification.requestPermission();
  if(p==="granted"){
    new Notification("Coiffure sur Nantes",{body:"Les notifications sont activées pour cette session."});
  }else{
    alert("Les notifications n'ont pas été autorisées.");
  }
}

 const ca=arr.reduce((s,a)=>s+Number(a.price||0),0), dep=arr.reduce((s,a)=>s+Number(a.deposit||0),0), sol=ca-dep;

 <div class="card"><h2>Rendez-vous du mois</h2>${arr.map(a=>`<div class="appt"><b>${frDate(a.date)} · ${esc(a.clientName)}</b><div class="small">${esc(a.service)} · ${euro(a.price)} · Acompte ${euro(a.deposit)}</div></div>`).join("")||'<div class="emptymsg">Aucune donnée.</div>'}</div>`;
}

});
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
