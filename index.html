<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#b76e79"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><title>Coiffure sur Nantes</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#fff7f7;color:#292226}header{background:linear-gradient(135deg,#b76e79,#d99aa3);color:#fff;padding:25px 18px;border-radius:0 0 28px 28px}h1{margin:0;font-size:24px}header p{margin:4px 0 0;opacity:.9}.wrap{max-width:760px;margin:auto;padding:16px 16px 100px}.card{background:#fff;border-radius:18px;padding:15px;box-shadow:0 3px 15px #0000000d;margin-bottom:12px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.btn{border:0;border-radius:13px;padding:12px 15px;background:#b76e79;color:#fff;font-weight:700;font-size:14px}.btn2{background:#f3e1e4;color:#7f4650}h2{margin:5px 0 15px}.muted{font-size:13px;color:#7d7075}.pill{font-size:11px;border-radius:99px;padding:5px 8px;background:#e7f5e9;color:#32723b}.pending{background:#fff0cf;color:#8a6100}.cancel{background:#f8dddd;color:#9a3d43}input,select,textarea{width:100%;padding:12px;border:1px solid #eadde0;border-radius:12px;margin:5px 0 12px;background:#fff;font-size:15px;font-family:inherit}textarea{min-height:80px;resize:vertical}label{font-size:13px;font-weight:650}.section-title{font-weight:800;margin:14px 0 8px}.calendar-head{display:grid;grid-template-columns:40px 1fr 40px;align-items:center;text-align:center;margin-bottom:12px}.calendar-head button{border:0;background:#f3e1e4;border-radius:12px;height:38px;font-size:20px;color:#7f4650}.month{font-weight:800;font-size:18px;text-transform:capitalize}.week{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:5px}.dow{text-align:center;font-size:11px;color:#8c7d82;padding:4px 0}.day{min-height:54px;border:1px solid #f0e5e7;background:#fff;border-radius:10px;padding:5px;position:relative;text-align:left}.day.muted-day{opacity:.38}.day.today{border:2px solid #b76e79}.day.selected{background:#f7e6e8}.num{font-size:12px;font-weight:700}.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#b76e79;margin:1px}.day .count{font-size:9px;color:#7b6268}.appt{border-left:4px solid #b76e79}.appt.pending-border{border-left-color:#e2aa35}.appt.cancel-border{border-left-color:#c75d67}.empty{text-align:center;color:#8a7b80;padding:25px}.danger{background:#9d454d}.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.info-box{background:#fff7f7;border-radius:12px;padding:10px}.info-box b{display:block;font-size:13px}.info-box span{font-size:13px;color:#6f6267;word-break:break-word}nav{position:fixed;z-index:5;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #eee;padding:8px 8px calc(8px + env(safe-area-inset-bottom));display:flex;justify-content:space-around}nav button{border:0;background:none;color:#75666b;font-size:11px}nav b{display:block;font-size:19px}nav .active{color:#b76e79;font-weight:700}@media(max-width:430px){.info-grid{grid-template-columns:1fr}}
</style></head><body>
<header><h1>Coiffure sur Nantes</h1><p>Agenda & gestion de votre activité ✨</p></header><main class="wrap" id="app"></main><nav><button id="n-home" onclick="show('home')"><b>⌂</b>Accueil</button><button id="n-rdv" onclick="show('rdv')"><b>📅</b>Rendez-vous</button><button id="n-clients" onclick="clients()"><b>👩🏾</b>Clientes</button><button id="n-budget" onclick="show('budget')"><b>💰</b>Budget</button></nav>
<script>
const K='csn_data';
let d=JSON.parse(localStorage.getItem(K)||'null')||{rdv:[],clients:[],depenses:[],services:[{n:'Knotless medium',p:50},{n:'Knotless fine',p:50},{n:'Vanille twist',p:50},{n:'Fulani twist',p:50},{n:'Cornrows',p:45}]};
// Compatibilité avec l'ancienne version où les clientes étaient de simples chaînes.
d.clients=(d.clients||[]).map((c,i)=>typeof c==='string'?{id:'old-'+i,name:c,phone:'',email:'',note:''}:c);
d.rdv=(d.rdv||[]).map((a,i)=>{if(!a.clientName)a.clientName=a.client||''; if(!a.clientId){let c=d.clients.find(x=>x.name===a.clientName); if(c)a.clientId=c.id;} return a});
let viewDate=new Date(),selectedDate=new Date().toISOString().slice(0,10);const save=()=>localStorage.setItem(K,JSON.stringify(d));const money=n=>Number(n||0).toLocaleString('fr-FR',{style:'currency',currency:'EUR'});const iso=x=>`${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`;const fmtDate=s=>new Intl.DateTimeFormat('fr-FR',{weekday:'long',day:'numeric',month:'long'}).format(new Date(s+'T12:00:00'));const esc=s=>String(s??'').replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]));
function active(n){document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));document.getElementById('n-'+n)?.classList.add('active')}function show(x){if(x==='home')home();if(x==='rdv')rdv();if(x==='budget')budget()}
function home(){active('home');let today=iso(new Date()),r=d.rdv.filter(x=>x.date===today);app.innerHTML=`<h2>Bonjour 👋🏾</h2><div class="card"><div class="row"><div><div class="muted">Aujourd'hui</div><b>${fmtDate(today)}</b></div><span class="pill">${r.length} RDV</span></div>${r.length?r.map(card).join(''):'<div class="empty">Aucun rendez-vous aujourd’hui</div>'}</div><button class="btn" style="width:100%" onclick="newRdv()">＋ Nouveau rendez-vous</button>`}
function getClient(a){return d.clients.find(c=>c.id===a.clientId)||d.clients.find(c=>c.name===a.clientName)||null}
function card(a){let cls=a.status==='En attente'?'pending-border':a.status==='Annulé'?'cancel-border':'';let pc=a.status==='En attente'?'pending':a.status==='Annulé'?'cancel':'';let c=getClient(a);return `<div class="card appt ${cls}" onclick="editRdv(${d.rdv.indexOf(a)})"><div class="row"><b>${esc(a.time)} · ${esc(a.clientName)}</b><b>${money(a.price)}</b></div><div class="muted">${esc(a.service)} · Acompte ${money(a.deposit)}</div>${c?.phone?`<div class="muted">📞 ${esc(c.phone)}</div>`:''}<div style="margin-top:6px"><span class="pill ${pc}">${esc(a.status)}</span></div></div>`}
function dayCell(dt,muted){let s=iso(dt),items=d.rdv.filter(x=>x.date===s&&x.status!=='Annulé');let cl=muted?'muted-day':'';if(s===iso(new Date()))cl+=' today';if(s===selectedDate)cl+=' selected';return `<button class="day ${cl}" onclick="selectDay('${s}')"><span class="num">${dt.getDate()}</span><div>${items.slice(0,3).map(()=>'<span class="dot"></span>').join('')}</div>${items.length?`<div class="count">${items.length} RDV</div>`:''}</button>`}
function rdv(){active('rdv');let y=viewDate.getFullYear(),m=viewDate.getMonth(),first=new Date(y,m,1),last=new Date(y,m+1,0),start=(first.getDay()+6)%7,cells=[];for(let i=0;i<start;i++)cells.push(dayCell(new Date(y,m,-(start-i-1)),true));for(let n=1;n<=last.getDate();n++)cells.push(dayCell(new Date(y,m,n),false));while(cells.length%7)cells.push(dayCell(new Date(y,m+1,cells.length-last.getDate()-start+1),true));let month=new Intl.DateTimeFormat('fr-FR',{month:'long',year:'numeric'}).format(first),r=d.rdv.filter(x=>x.date===selectedDate).sort((a,b)=>a.time.localeCompare(b.time));app.innerHTML=`<div class="calendar-head"><button onclick="prevMonth()">‹</button><div class="month">${month}</div><button onclick="nextMonth()">›</button></div><div class="week">${['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'].map(x=>`<div class="dow">${x}</div>`).join('')}</div><div class="week">${cells.join('')}</div><div class="row" style="margin:16px 0 8px"><div><b>${fmtDate(selectedDate)}</b><div class="muted">${r.length} rendez-vous</div></div><button class="btn" onclick="newRdv()">＋ Ajouter</button></div>${r.length?r.map(card).join(''):'<div class="card empty">Aucun rendez-vous ce jour.<br><br><button class="btn" onclick="newRdv()">Ajouter un rendez-vous</button></div>'}`}
function selectDay(s){selectedDate=s;viewDate=new Date(s+'T12:00:00');rdv()}function prevMonth(){viewDate.setMonth(viewDate.getMonth()-1);selectedDate=iso(new Date(viewDate.getFullYear(),viewDate.getMonth(),1));rdv()}function nextMonth(){viewDate.setMonth(viewDate.getMonth()+1);selectedDate=iso(new Date(viewDate.getFullYear(),viewDate.getMonth(),1));rdv()}
function clientOptions(selected=''){let opts=d.clients.map(c=>`<option value="${esc(c.id)}" ${c.id===selected?'selected':''}>${esc(c.name)}</option>`).join('');return `<option value="">＋ Nouvelle cliente</option>${opts}`}
function newRdv(){app.innerHTML=`<div class="row"><h2>Nouveau rendez-vous</h2><button class="btn btn2" onclick="rdv()">Annuler</button></div><div class="card"><div class="section-title">👩🏾 Informations cliente</div><label>Cliente existante</label><select id="existingClient" onchange="fillClient()">${clientOptions()}</select><label>Prénom et nom *</label><input id="clientName" placeholder="Ex. Sarah Dupont"><div class="info-grid"><div><label>Téléphone</label><input id="phone" type="tel" placeholder="06 00 00 00 00"></div><div><label>E-mail</label><input id="email" type="email" placeholder="cliente@email.com"></div></div><label>Notes sur la cliente</label><textarea id="clientNote" placeholder="Préférences, longueur habituelle, informations utiles..."></textarea><div class="section-title">📅 Rendez-vous</div><label>Prestation</label><select id="service" onchange="price.value=this.options[this.selectedIndex].dataset.p">${d.services.map(s=>`<option data-p="${s.p}">${esc(s.n)}</option>`).join('')}</select><div class="info-grid"><div><label>Date *</label><input id="date" type="date" value="${selectedDate}"></div><div><label>Heure *</label><input id="time" type="time" value="10:00"></div></div><div class="info-grid"><div><label>Prix (€)</label><input id="price" type="number" value="${d.services[0]?.p||0}"></div><div><label>Acompte (€)</label><input id="deposit" type="number" value="20"></div></div><label>Statut</label><select id="status"><option>Confirmé</option><option>En attente</option><option>Annulé</option></select><label>Notes du rendez-vous</label><textarea id="notes" placeholder="Mèches fournies, modèle, couleur, etc."></textarea><button class="btn" style="width:100%" onclick="addRdv()">Enregistrer le rendez-vous</button></div>`}
function fillClient(){let c=d.clients.find(x=>x.id===existingClient.value);if(!c){clientName.value='';phone.value='';email.value='';clientNote.value='';return}clientName.value=c.name;phone.value=c.phone||'';email.value=c.email||'';clientNote.value=c.note||''}
function addRdv(){let name=clientName.value.trim(),ph=phone.value.trim(),em=email.value.trim(),cn=clientNote.value.trim();if(!name||!date.value||!time.value)return alert('Remplis au minimum le nom de la cliente, la date et l’heure.');let c=d.clients.find(x=>x.id===existingClient.value);if(!c)c=d.clients.find(x=>x.name.toLowerCase()===name.toLowerCase());if(c){c.name=name;c.phone=ph;c.email=em;c.note=cn}else{c={id:'c-'+Date.now(),name,phone:ph,email:em,note:cn};d.clients.push(c)}let a={clientId:c.id,clientName:c.name,service:service.value,date:date.value,time:time.value,price:+price.value,deposit:+deposit.value,status:status.value,notes:notes.value};if(d.rdv.some(x=>x.date===a.date&&x.time===a.time&&x.status!=='Annulé'))return alert('⚠️ Ce créneau est déjà occupé.');d.rdv.push(a);save();selectedDate=a.date;viewDate=new Date(a.date+'T12:00:00');rdv()}
function editRdv(i){let a=d.rdv[i],c=getClient(a);app.innerHTML=`<div class="row"><h2>Rendez-vous</h2><button class="btn btn2" onclick="rdv()">Retour</button></div><div class="card"><div class="row"><b>${esc(a.clientName)}</b><span>${money(a.price)}</span></div><p class="muted">${fmtDate(a.date)} à ${esc(a.time)}</p><div class="info-grid">${c?.phone?`<div class="info-box"><b>📞 Téléphone</b><span>${esc(c.phone)}</span></div>`:''}${c?.email?`<div class="info-box"><b>✉️ E-mail</b><span>${esc(c.email)}</span></div>`:''}</div><p><b>Prestation :</b> ${esc(a.service)}</p><p>Acompte : <b>${money(a.deposit)}</b> · Solde : <b>${money(a.price-a.deposit)}</b></p><p><span class="pill ${a.status==='En attente'?'pending':a.status==='Annulé'?'cancel':''}">${esc(a.status)}</span></p>${c?.note?`<div class="info-box"><b>Notes cliente</b><span>${esc(c.note)}</span></div>`:''}${a.notes?`<div class="info-box" style="margin-top:8px"><b>Notes du rendez-vous</b><span>${esc(a.notes)}</span></div>`:''}<button class="btn" style="width:100%;margin-top:10px" onclick="editClient(${i})">Modifier les informations</button><button class="btn danger" style="width:100%;margin-top:8px" onclick="cancelRdv(${i})">Annuler ce rendez-vous</button></div>`}
function editClient(i){let a=d.rdv[i],c=getClient(a)||{id:a.clientId||'c-'+Date.now(),name:a.clientName,phone:'',email:'',note:''};app.innerHTML=`<div class="row"><h2>Modifier la cliente</h2><button class="btn btn2" onclick="editRdv(${i})">Retour</button></div><div class="card"><label>Prénom et nom</label><input id="ecname" value="${esc(c.name)}"><label>Téléphone</label><input id="ecphone" type="tel" value="${esc(c.phone||'')}"><label>E-mail</label><input id="ecemail" type="email" value="${esc(c.email||'')}"><label>Notes sur la cliente</label><textarea id="ecnote">${esc(c.note||'')}</textarea><button class="btn" style="width:100%" onclick="saveClientEdit(${i},'${esc(c.id)}')">Enregistrer</button></div>`}
function saveClientEdit(i,id){let c=d.clients.find(x=>x.id===id);if(!c){c={id,name:'',phone:'',email:'',note:''};d.clients.push(c)}c.name=ecname.value.trim();c.phone=ecphone.value.trim();c.email=ecemail.value.trim();c.note=ecnote.value.trim();d.rdv[i].clientId=c.id;d.rdv[i].clientName=c.name;save();editRdv(i)}
function cancelRdv(i){d.rdv[i].status='Annulé';save();rdv()}
function clients(){active('clients');let list=d.clients;app.innerHTML=`<div class="row"><h2>Clientes</h2><span class="pill">${list.length} cliente${list.length>1?'s':''}</span></div><div class="card">${list.length?list.map(c=>{let rr=d.rdv.filter(a=>a.clientId===c.id||a.clientName===c.name);return `<div class="card" style="margin:0 0 8px;background:#fff7f7" onclick="clientDetail('${esc(c.id)}')"><div class="row"><b>👩🏾 ${esc(c.name)}</b><span class="muted">${rr.length} RDV</span></div>${c.phone?`<div class="muted">📞 ${esc(c.phone)}</div>`:''}${c.email?`<div class="muted">✉️ ${esc(c.email)}</div>`:''}</div>`}).join(''):'<div class="empty">Aucune cliente enregistrée.<br>Elle sera ajoutée automatiquement lors d’un nouveau rendez-vous.</div>'}</div><button class="btn" style="width:100%" onclick="newRdv()">＋ Nouveau rendez-vous</button>`}
function clientDetail(id){let c=d.clients.find(x=>x.id===id);if(!c)return clients();let rr=d.rdv.filter(a=>a.clientId===id||a.clientName===c.name).sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time));app.innerHTML=`<div class="row"><h2>${esc(c.name)}</h2><button class="btn btn2" onclick="clients()">Retour</button></div><div class="card"><div class="info-grid"><div class="info-box"><b>📞 Téléphone</b><span>${esc(c.phone||'Non renseigné')}</span></div><div class="info-box"><b>✉️ E-mail</b><span>${esc(c.email||'Non renseigné')}</span></div></div><div class="info-box" style="margin-top:8px"><b>📝 Notes</b><span>${esc(c.note||'Aucune note')}</span></div></div><h3>Historique des rendez-vous</h3>${rr.length?rr.map(card).join(''):'<div class="card empty">Aucun rendez-vous.</div>'}`}
function budget(){active('budget');let ca=d.rdv.reduce((s,x)=>s+(x.status==='Annulé'?0:+x.price),0),dep=d.depenses.reduce((s,x)=>s+ +x.m,0);app.innerHTML=`<h2>Budget</h2><div class="card"><div class="muted">Recettes</div><div style="font-size:25px;font-weight:800">${money(ca)}</div><div class="muted">Dépenses : ${money(dep)} · Bénéfice estimé : ${money(ca-dep)}</div></div><div class="card"><h3>Ajouter une dépense</h3><input id="dn" placeholder="Ex. mèches, gel, matériel"><input id="dm" type="number" placeholder="Montant €"><button class="btn" onclick="addDep()">Ajouter</button></div>`}function addDep(){if(!dn.value||!dm.value)return;d.depenses.push({n:dn.value,m:+dm.value});save();budget()}
show('home');if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');
</script></body></html>
